name: Feature request
description: A new option, output format, data source or behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the solution. Example commands you wish worked.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
