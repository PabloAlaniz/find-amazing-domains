name: Live registry check (weekly, non-blocking)

# Runs the `integration` tests against real RDAP/WHOIS servers to catch
# registry-side drift (response formats, "not found" patterns, endpoints).
# A failure here usually means a registry changed or is down, not that the
# code regressed. It never gates pull requests.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: pytest -m integration (live registries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Separate workflow, so a red run here never blocks merges; it is red on
    # purpose so registry drift (or a stale test) gets noticed.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # whois.nic.it throttles hard (silent drops after ~50 queries), so its
      # case is deselected here. Run it by hand when you need it.
      - run: >-
          pytest -m integration --no-cov -v
          --deselect "tests/test_registrar_integration.py::test_whois_taken_and_available[it]"
