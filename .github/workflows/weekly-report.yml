name: Weekly domain hacks report

# Checks the bundled word lists (data/wordlists/) against every TLD domainhack
# can query and commits the result to reports/latest.md plus a dated copy. One
# request in flight per registry host, one second apart; the result cache is
# kept between runs so taken names are not asked again before they could have
# expired. Raw results are kept as a workflow artifact, not in the repository.

on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: check word lists and publish reports/latest.md
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional repository variable: sent as the HTTP From header on RDAP
      # requests so registry operators can reach the person running this.
      DOMAINHACK_CONTACT: ${{ vars.DOMAINHACK_CONTACT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Restore the result cache
        uses: actions/cache/restore@v6
        with:
          path: .domainhack-cache
          key: weekly-report-cache-${{ github.run_id }}
          restore-keys: weekly-report-cache-
      - name: Check the word lists at the registries
        id: check
        run: |
          mkdir -p .domainhack-cache
          cat data/wordlists/*.txt | sort -u > words.txt
          tlds=$(domainhack tlds --json | python -c 'import json, sys; print(",".join(t["tld"] for t in json.load(sys.stdin) if t["kind"] != "unsupported"))')
          echo "tlds=$(echo "$tlds" | tr , "\n" | wc -l | tr -d " ")" >> "$GITHUB_OUTPUT"
          # Exit 1 means some lookups ended in ERROR; the report lists them.
          set +e
          domainhack --tld "$tlds" check --file words.txt --no-progress --parallel 4 \
            --confirm-dns --cache-path .domainhack-cache/results.sqlite3 \
            --output results.jsonl --format json > /dev/null
          echo "check exited with $?"
          test -s results.jsonl
      - name: Save the result cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .domainhack-cache
          key: weekly-report-cache-${{ github.run_id }}
      - name: Keep the raw results for 90 days
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ github.run_id }}
          path: results.jsonl
      - name: Render the report
        run: >-
          python tools/weekly_report.py results.jsonl
          --words data/wordlists/*.txt
          --tlds "${{ steps.check.outputs.tlds }}"
          --out reports
          --command "domainhack --tld <every checkable TLD> check --file words.txt --parallel 4 --confirm-dns --output results.jsonl"
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "report unchanged"
            exit 0
          fi
          git commit -m "Update weekly domain hacks report [skip ci]"
          git push
