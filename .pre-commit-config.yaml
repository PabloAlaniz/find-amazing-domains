# These revs are the source of truth for lint and type-check, because CI runs
# `pre-commit run --all-files`. The `dev` extra in pyproject.toml pins
# compatible ranges (ruff~=X.Y.Z, mypy~=X.Y.Z). Bump them together: run
# `pre-commit autoupdate`, then update pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Recorded registry replies: keep them byte-identical to what was received.
        exclude: ^tests/fixtures/whois/
      - id: end-of-file-fixer
        # Verbatim IANA bootstrap snapshot and recorded registry replies: keep
        # them byte-identical to upstream.
        exclude: ^(src/domainhack/data/rdap_dns\.json|tests/fixtures/whois/.*)$
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # The hook runs in an isolated env. List every runtime dependency and
        # stub package so imports resolve the same way as in `pip install -e .[dev]`.
        additional_dependencies:
          - dnspython>=2.6,<3
          - httpx>=0.27
          - idna>=3.7
          - tqdm>=4.66
          - types-tqdm>=4.66
        args: [--config-file=pyproject.toml]
        pass_filenames: false
