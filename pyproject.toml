[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license` string below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domainhack"
dynamic = ["version"]
description = "Find domain hacks hiding in real words"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Alaniz" }]
keywords = ["domain", "domain-hack", "tld", "rdap", "whois", "availability", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.6,<3",  # 2.6+ supports 3.10-3.14; used by `check --confirm-dns`
    "httpx>=0.27",
    "idna>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "coverage>=7.10",  # [tool.coverage.run] patch = ["subprocess"]
    # Keep ruff/mypy in step with the revs in .pre-commit-config.yaml
    # (CI runs pre-commit, so those revs are what actually gates merges).
    "ruff~=0.16.10",
    "mypy~=2.4.0",
    "pre-commit>=4.0",
    "types-tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/find-amazing-domains"
Repository = "https://github.com/PabloAlaniz/find-amazing-domains"
Issues = "https://github.com/PabloAlaniz/find-amazing-domains/issues"
Changelog = "https://github.com/PabloAlaniz/find-amazing-domains/blob/main/CHANGELOG.md"

[project.scripts]
domainhack = "domainhack.cli.app:main"

[tool.setuptools.dynamic]
# Single source of truth: src/domainhack/__init__.py (read statically, not imported).
version = {attr = "domainhack.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled IANA RDAP bootstrap snapshot (see adapters/rdap_bootstrap.py), the
# IANA TLD list and curated second-level suffixes (see adapters/iana_tlds.py),
# and the PEP 561 marker that tells type checkers the package ships inline types.
domainhack = ["data/*.json", "data/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=domainhack --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: tests that hit external services (RDAP and WHOIS servers)",
]

# ── ruff ────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["domainhack"]

# ── mypy ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["domainhack"]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["domainhack"]
patch = ["subprocess"]
